name: Enable GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/enable-pages.yml
  workflow_dispatch:

permissions:
  pages: write

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Publish the gh-pages branch with GitHub Pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          repo="${{ github.repository }}"
          if gh api "repos/${repo}/pages" > /tmp/pages.json 2>/tmp/pages.err; then
            echo "Pages site already exists"
          else
            gh api --method POST "repos/${repo}/pages" \
              -f "build_type=legacy" \
              -f "source[branch]=gh-pages" \
              -f "source[path]=/"
          fi
          gh api "repos/${repo}/pages"
